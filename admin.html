
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in.P 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 20px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .sub { color: #888; margin-bottom: 30px; }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 18px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }
    textarea { min-height: 110px; resize: vertical; }
    label { font-size: 14px; font-weight: bold; }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: .8; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .delete { background: #b83232; }
    .edit { background: #666; }
    .add-pair { background: #444; margin-bottom: 20px; }
    .remove-pair { background: #b83232; margin-top: 5px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .work {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid #eee;
      padding: 18px 0;
    }
    .work img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      background: #eee;
      border-radius: 6px;
    }
    .work-info { flex: 1; min-width: 0; }
    .work-info p { color: #777; font-size: 14px; }
    .work-actions { display: flex; gap: 8px; }
    .hidden { display: none; }
    #message { margin-top: 15px; font-size: 14px; }
    .hint { color: #888; font-size: 12px; margin-top: -12px; }
    .pair-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin: 15px 0;
      background: #fafafa;
    }
    .pair-title { font-weight: bold; margin-bottom: 12px; }
    .pair-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0;
    }
    .pair-preview img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 5px;
    }
    .preview-label { font-size: 12px; color: #777; }
    .pair-card input { margin-bottom: 10px; }
    @media(max-width:600px) {
      body { padding: 20px 12px; }
      .panel { padding: 18px; }
      .work { flex-wrap: wrap; }
      .work-info { width: calc(100% - 130px); }
      .pair-preview img { height: 100px; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>in.P</h1>
  <p class="sub">관리자 페이지</p>

  <section id="loginPanel" class="panel">
    <h2>관리자 로그인</h2>
    <label>이메일</label>
    <input type="email" id="email" placeholder="관리자 이메일">
    <label>비밀번호</label>
    <input type="password" id="password" placeholder="비밀번호">
    <button id="loginBtn">로그인</button>
    <p id="loginMessage"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="top">
      <h2>시공 사례 관리</h2>
      <button id="logoutBtn">로그아웃</button>
    </div>

    <div class="panel">
      <h2 id="formTitle">새 시공 사례 등록</h2>

      <form id="workForm">
        <label>시공 분야</label>
        <select id="category" required>
          <option value="">분야 선택</option>
          <option value="entrance">현관문</option>
          <option value="kitchen">싱크대</option>
          <option value="door">방문 및 문틀</option>
          <option value="finish">실내 마감</option>
          <option value="window">창호 및 창틀</option>
          <option value="furniture">가구</option>
        </select>

        <label>시공 제목</label>
        <input type="text" id="title"
          placeholder="예: 아파트 현관문 필름 시공" required>

        <label>시공 설명</label>
        <textarea id="description"
          placeholder="시공 내용과 작업 특징을 입력해 주세요."></textarea>

        <h3>Before & After 사진</h3>
        <p class="hint">
          시공 전과 시공 후 사진을 같은 번호끼리 한 쌍으로 등록해 주세요.
          첫 번째 사진 쌍이 목록의 대표 사진으로 사용됩니다.
        </p>

        <div id="pairContainer"></div>

        <button type="button" class="add-pair" id="addPairBtn">
          + 사진 쌍 추가
        </button>

        <button type="submit" id="submitBtn">시공 사례 게시하기</button>
        <button type="button" id="cancelEditBtn" class="edit hidden">
          수정 취소
        </button>

        <p id="message"></p>
      </form>
    </div>

    <div class="panel">
      <h2>등록된 시공 사례</h2>
      <div id="workList">게시물을 불러오는 중...</div>
    </div>
  </section>
</div>

<script>
  const SUPABASE_URL = "https://dbrjtwzutsdixssvolae.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ixVf_P6QdVK5u6bpxQEKPA_v_4zVNAb";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const loginMessage = document.getElementById("loginMessage");
  const message = document.getElementById("message");
  const workList = document.getElementById("workList");
  const pairContainer = document.getElementById("pairContainer");

  let currentUser = null;
  let editingId = null;
  let pairCount = 0;

  const categories = {
    entrance: "현관문",
    kitchen: "싱크대",
    door: "방문 및 문틀",
    finish: "실내 마감",
    window: "창호 및 창틀",
    furniture: "가구"
  };

  function escapeHTML(value) {
    return String(value || "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  // 사진 쌍 추가
  function addPair(beforeUrl = "", afterUrl = "") {
    pairCount++;

    const card = document.createElement("div");
    card.className = "pair-card";
    card.dataset.beforeUrl = beforeUrl;
    card.dataset.afterUrl = afterUrl;
    card.dataset.removed = "false";

    card.innerHTML = `
      <div class="pair-title">사진 쌍 ${pairCount}</div>

      ${beforeUrl || afterUrl ? `
        <div class="pair-preview">
          <div>
            <div class="preview-label">BEFORE</div>
            ${beforeUrl ? `<img src="${escapeHTML(beforeUrl)}" alt="기존 시공 전 사진">` : ""}
          </div>
          <div>
            <div class="preview-label">AFTER</div>
            ${afterUrl ? `<img src="${escapeHTML(afterUrl)}" alt="기존 시공 후 사진">` : ""}
          </div>
        </div>
      ` : ""}

      <label>시공 전 사진 (BEFORE)</label>
      <input type="file" class="before-file" accept="image/*">

      <label>시공 후 사진 (AFTER)</label>
      <input type="file" class="after-file" accept="image/*">

      <button type="button" class="remove-pair">이 사진 쌍 삭제</button>
    `;

    card.querySelector(".remove-pair").addEventListener("click", () => {
      card.dataset.removed = "true";
      card.remove();
      updatePairTitles();
    });

    pairContainer.appendChild(card);
  }

  function updatePairTitles() {
    [...pairContainer.querySelectorAll(".pair-card")].forEach((card, index) => {
      card.querySelector(".pair-title").textContent = `사진 쌍 ${index + 1}`;
    });
  }

  document.getElementById("addPairBtn").addEventListener("click", () => {
    addPair();
  });

  function resetForm() {
    editingId = null;
    document.getElementById("workForm").reset();
    pairContainer.innerHTML = "";
    pairCount = 0;
    addPair();

    document.getElementById("formTitle").textContent = "새 시공 사례 등록";
    document.getElementById("submitBtn").textContent = "시공 사례 게시하기";
    document.getElementById("cancelEditBtn").classList.add("hidden");
    message.textContent = "";
  }

  // 로그인
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginMessage.textContent = "로그인 중...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      loginMessage.textContent = "로그인 실패: " + error.message;
      return;
    }

    currentUser = data.user;
    showDashboard();
  });

  // 로그아웃
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    currentUser = null;
    dashboard.classList.add("hidden");
    loginPanel.classList.remove("hidden");
  });

  async function showDashboard() {
    loginPanel.classList.add("hidden");
    dashboard.classList.remove("hidden");
    await loadWorks();
  }

  async function checkLogin() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      currentUser = data.session.user;
      showDashboard();
    }
  }

  // 사진 업로드
  async function uploadImage(file, type) {
    if (!file) return null;

    const extension = file.name.split(".").pop().toLowerCase();
    const filePath =
      currentUser.id + "/" + Date.now() + "_" +
      Math.random().toString(36).slice(2) + "_" + type + "." + extension;

    const { error } = await supabaseClient.storage
      .from("works")
      .upload(filePath, file);

    if (error) throw error;

    const { data } = supabaseClient.storage
      .from("works")
      .getPublicUrl(filePath);

    return data.publicUrl;
  }

  // 게시물 등록 및 수정
  document.getElementById("workForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!currentUser) {
      message.textContent = "관리자 로그인이 필요합니다.";
      return;
    }

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    message.textContent = "저장 중입니다. 잠시만 기다려 주세요.";

    try {
      const category = document.getElementById("category").value;
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();

      let existing = null;

      if (editingId) {
        const { data, error } = await supabaseClient
          .from("works")
          .select("*")
          .eq("id", editingId)
          .single();

        if (error) throw error;
        existing = data;
      }

      const cards = [...pairContainer.querySelectorAll(".pair-card")];

      if (cards.length === 0) {
        throw new Error("최소 한 쌍의 사진이 필요합니다.");
      }

      const galleryPairs = [];

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const beforeFile = card.querySelector(".before-file").files[0];
        const afterFile = card.querySelector(".after-file").files[0];

        let beforeUrl = card.dataset.beforeUrl || "";
        let afterUrl = card.dataset.afterUrl || "";

        if (Boolean(beforeFile) !== Boolean(afterFile)) {
          throw new Error(`사진 쌍 ${i + 1}: BEFORE와 AFTER 사진을 모두 선택해 주세요.`);
        }

        if (beforeFile && afterFile) {
          beforeUrl = await uploadImage(beforeFile, "before");
          afterUrl = await uploadImage(afterFile, "after");
        }

        if (!beforeUrl || !afterUrl) {
          throw new Error(`사진 쌍 ${i + 1}: BEFORE와 AFTER 사진을 모두 등록해 주세요.`);
        }

        galleryPairs.push({
          before: beforeUrl,
          after: afterUrl
        });
      }

      const firstPair = galleryPairs[0];

      const workData = {
        category,
        title,
        description,
        before_image: firstPair.before,
        after_image: firstPair.after,
        gallery_pairs: galleryPairs
      };

      let result;

      if (editingId) {
        result = await supabaseClient
          .from("works")
          .update(workData)
          .eq("id", editingId);
      } else {
        result = await supabaseClient
          .from("works")
          .insert([workData]);
      }

      if (result.error) throw result.error;

      message.textContent = "저장 완료!";
      resetForm();
      await loadWorks();

    } catch (error) {
      message.textContent = "오류 발생: " + error.message;
    } finally {
      submitBtn.disabled = false;
    }
  });

  // 게시물 목록
  async function loadWorks() {
    workList.textContent = "불러오는 중...";

    const { data, error } = await supabaseClient
      .from("works")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      workList.textContent = "게시물 불러오기 실패: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      workList.textContent = "아직 등록된 시공 사례가 없습니다.";
      return;
    }

    workList.innerHTML = data.map(work => `
      <div class="work">
        <img src="${escapeHTML(work.after_image || work.before_image || "")}"
             alt="시공 사진"
             onerror="this.style.display='none'">

        <div class="work-info">
          <strong>${escapeHTML(work.title)}</strong>
          <p>${escapeHTML(categories[work.category] || work.category)}</p>
          <p>${escapeHTML(work.description)}</p>
          <p>사진 쌍: ${
            Array.isArray(work.gallery_pairs) && work.gallery_pairs.length
              ? work.gallery_pairs.length
              : (work.before_image && work.after_image ? 1 : 0)
          }개</p>

          <div class="work-actions">
            <button class="edit" data-action="edit"
              data-id="${escapeHTML(work.id)}">수정</button>
            <button class="delete" data-action="delete"
              data-id="${escapeHTML(work.id)}">삭제</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  // 수정 및 삭제
  workList.addEventListener("click", async (e) => {
    const button = e.target.closest("button[data-action]");
    if (!button) return;

    const id = button.dataset.id;
    const action = button.dataset.action;

    if (action === "edit") {
      const { data, error } = await supabaseClient
        .from("works")
        .select("*")
        .eq("id", id)
        .single();

      if (error) {
        alert(error.message);
        return;
      }

      editingId = id;

      document.getElementById("category").value = data.category;
      document.getElementById("title").value = data.title;
      document.getElementById("description").value = data.description || "";

      pairContainer.innerHTML = "";
      pairCount = 0;

      let pairs = Array.isArray(data.gallery_pairs)
        ? data.gallery_pairs
        : [];

      // 예전 게시물은 기존 사진 주소를 사용
      if (pairs.length === 0 && (data.before_image || data.after_image)) {
        pairs = [{
          before: data.before_image || "",
          after: data.after_image || ""
        }];
      }

      pairs.forEach(pair => {
        addPair(pair.before || "", pair.after || "");
      });

      if (pairs.length === 0) addPair();

      document.getElementById("formTitle").textContent = "시공 사례 수정";
      document.getElementById("submitBtn").textContent = "수정 내용 저장";
      document.getElementById("cancelEditBtn").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    if (action === "delete") {
      if (!confirm("이 시공 사례를 삭제할까요?")) return;

      const { error } = await supabaseClient
        .from("works")
        .delete()
        .eq("id", id);

      if (error) {
        alert("삭제 실패: " + error.message);
        return;
      }

      alert("게시물이 삭제되었습니다.");
      await loadWorks();
    }
  });

  document.getElementById("cancelEditBtn")
    .addEventListener("click", resetForm);

  resetForm();
  checkLogin();
</script>
</body>
</html>
