
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>in.P | Work Detail</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .header {
      width: 100%;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      color: #111;
      font-size: 25px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: -1px;
    }

    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 13px;
    }

    .detail-container {
      width: 88%;
      max-width: 1200px;
      margin: 75px auto;
    }

    .work-heading {
      margin-bottom: 35px;
    }

    .work-category {
      color: #999;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .work-title {
      font-size: 30px;
      font-weight: 500;
      margin: 0 0 12px;
    }

    .work-description {
      color: #888;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .gallery-labels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 0 auto 12px;
  max-width: 700px;
}

    .gallery-labels span {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #555;
    }

    .gallery-images {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 700px;
  margin: 0 auto;
}

    .gallery-images img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #f3f3f3;
    }

    .gallery-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
    }

    .gallery-button {
      background: none;
      border: 1px solid #ddd;
      padding: 12px 22px;
      color: #333;
      cursor: pointer;
      font-size: 13px;
    }

    .gallery-button:disabled {
      color: #bbb;
      cursor: not-allowed;
    }

    .photo-count {
      color: #888;
      font-size: 13px;
    }

    .error-message {
      padding: 100px 20px;
      text-align: center;
      color: #888;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .header {
        padding: 22px 5%;
      }

      .detail-container {
        width: 90%;
        margin: 45px auto;
      }

      .work-title {
        font-size: 23px;
      }

      .gallery-images {
        gap: 7px;
      }

      .gallery-labels {
        gap: 7px;
      }

      .gallery-images img {
        aspect-ratio: 3 / 4;
      }

      .gallery-button {
        padding: 10px 15px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">in.P</a>
    <a href="javascript:history.back()" class="back-link">← BACK</a>
  </header>

  <main class="detail-container" id="detailContainer">
    <div class="error-message">시공 사진을 불러오는 중입니다.</div>
  </main>

  <script>
    const SUPABASE_URL = "https://dbrjtwzutsdixssvolae.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ixVf_P6QdVK5u6bpxQEKPA_v_4zVNAb";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const detailContainer = document.getElementById("detailContainer");

    let galleryPairs = [];
    let currentIndex = 0;
    let touchStartX = 0;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    async function loadWork() {
      const params = new URLSearchParams(window.location.search);
      const workId = params.get("id");

      if (!workId) {
        showError("시공 사례 정보가 없습니다.");
        return;
      }

      const { data, error } = await supabaseClient
        .from("works")
        .select("id, title, description, before_image, after_image, gallery_pairs, created_at")
        .eq("id", workId)
        .single();

      if (error || !data) {
        console.error(error);
        showError("시공 사례를 불러오지 못했습니다.");
        return;
      }

      if (Array.isArray(data.gallery_pairs) && data.gallery_pairs.length > 0) {
        galleryPairs = data.gallery_pairs.filter(
          pair => pair.before && pair.after
        );
      }

      // 기존에 등록된 시공 사례도 표시할 수 있도록 처리
      if (galleryPairs.length === 0 && data.before_image && data.after_image) {
        galleryPairs = [{
          before: data.before_image,
          after: data.after_image
        }];
      }

      if (galleryPairs.length === 0) {
        showError("등록된 BEFORE / AFTER 사진이 없습니다.");
        return;
      }

      renderWork(data);
    }

    function renderWork(work) {
      detailContainer.innerHTML = `
        <section class="work-heading">
          <div class="work-category">INTERIOR FILM</div>
          <h1 class="work-title">${escapeHTML(work.title)}</h1>
          <p class="work-description">${escapeHTML(work.description || "")}</p>
        </section>

        <div class="gallery-labels">
          <span>BEFORE</span>
          <span>AFTER</span>
        </div>

        <div class="gallery-images">
          <img id="beforePhoto" src="" alt="시공 전 사진">
          <img id="afterPhoto" src="" alt="시공 후 사진">
        </div>

        <div class="gallery-controls">
          <button class="gallery-button" id="prevButton">← PREV</button>
          <span class="photo-count" id="photoCount"></span>
          <button class="gallery-button" id="nextButton">NEXT →</button>
        </div>
      `;

      document.getElementById("prevButton").addEventListener("click", showPrevious);
      document.getElementById("nextButton").addEventListener("click", showNext);

      const gallery = document.querySelector(".gallery-images");

      gallery.addEventListener("touchstart", event => {
        touchStartX = event.changedTouches[0].screenX;
      }, { passive: true });

      gallery.addEventListener("touchend", event => {
        const touchEndX = event.changedTouches[0].screenX;
        const difference = touchStartX - touchEndX;

        if (Math.abs(difference) < 50) return;

        if (difference > 0) {
          showNext();
        } else {
          showPrevious();
        }
      }, { passive: true });

      updateGallery();
    }

    function updateGallery() {
      const pair = galleryPairs[currentIndex];

      document.getElementById("beforePhoto").src = pair.before;
      document.getElementById("afterPhoto").src = pair.after;

      document.getElementById("photoCount").textContent =
        `${String(currentIndex + 1).padStart(2, "0")} / ${String(galleryPairs.length).padStart(2, "0")}`;

      document.getElementById("prevButton").disabled = currentIndex === 0;
      document.getElementById("nextButton").disabled =
        currentIndex === galleryPairs.length - 1;
    }

    function showPrevious() {
      if (currentIndex > 0) {
        currentIndex--;
        updateGallery();
      }
    }

    function showNext() {
      if (currentIndex < galleryPairs.length - 1) {
        currentIndex++;
        updateGallery();
      }
    }

    function showError(message) {
      detailContainer.innerHTML = `
        <div class="error-message">${escapeHTML(message)}</div>
      `;
    }

    loadWork();
  </script>

</body>
</html>
